<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Natal Chart Browser by Flat18 social preview</title>
  <desc id="desc">A branded social sharing image for the Natal Chart Browser web app.</desc>
  <defs>
